<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caderno de Receitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="assets/css/style.css" rel="stylesheet">
    <script src="assets/js/paginar.js"></script>
</head>
<body>
    <div class="main container mt-5">
        <div id="pag1" class="item active">
            <h2>Receita 1</h2>
            <img src="assets/images/receita1.jpg" alt="Receita 1" class="img-fluid">
            <p>Descrição da Receita 1...</p>
        </div>
        <div id="pag2" class="item">
            <h2>Receita 2</h2>
            <img src="assets/images/receita2.jpg" alt="Receita 2" class="img-fluid">
            <p>Descrição da Receita 2...</p>
        </div>
        <div id="pag3" class="item">
            <h2>Receita 3</h2>
            <img src="assets/images/receita3.jpg" alt="Receita 3" class="img-fluid">
            <p>Descrição da Receita 3...</p>
        </div>
        <ul class="pagination">
            <li class="page-item"><a class="page-link" href="#" onclick="paginar('pag1')">1</a></li>
            <li class="page-item"><a class="page-link" href="#" onclick="paginar('pag2')">2</a></li>
            <li class="page-item"><a class="page-link" href="#" onclick="paginar('pag3')">3</a></li>
        </ul>
    </div>
</body>
</html>
